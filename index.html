<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login 2.0</title>

  <link rel="stylesheet" href="estilos/mobilefirst.css">
  <link rel="stylesheet" href="estilos/mediaquery.css">
</head>
<body>
  <main>
    <h1>Login 2.0</h1>

    <section>
      
      <div id="img">
        
      </div>

      <div id="formulario">
        <p>
          Aproveite essa nova versão do login.
        </p>
        

         <form action="login2.0.py" method="post" autocomplete="on">
          <label for="iemail">Email: </label>
          <input id="dados1" class="dados" type="email" name="email" id="iemail" autocomplete="email" required placeholder="Digite o email aqui">
          <br>
          <label for="isenha">Senha: </label>
          <input class="dados" type="password" name="senha" id="isenha" autocomplete="current-password" required placeholder="Digite a senha aqui" maxlength="8">

          <input class="botao-cadastro" type="submit" value="Enviar">
          <input class="botao-cadastro" type="reset" value="Limpar">
          <br>
          <input class="botao-esqueci-a-senha" type="submit" value="Esqueci a senha">
         </form>
      </div>
    </section>
  </main>
</body>
</html>
